<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AppDesk - pembuat shortcut aplikasi Linux" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b1747"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1080" cy="40" r="180" fill="#7c3aed" opacity="0.18"/>
    <circle cx="80" cy="330" r="160" fill="#22d3ee" opacity="0.12"/>
    <rect x="0" y="312" width="1200" height="8" fill="url(#accent)"/>
  </g>

  <!-- Ikon aplikasi -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="112" height="112" rx="26" fill="url(#iconbg)"/>
  </g>
  <path d="M104 108 L134 126 L104 144" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="142" y="146" width="24" height="9" rx="4.5" fill="#fff"/>

  <!-- Judul -->
  <text x="212" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">App<tspan fill="url(#accent)">Desk</tspan></text>
  <text x="214" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#cbd5e1">Buat, edit, dan hapus shortcut aplikasi Linux</text>
  <text x="214" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94a3b8">lewat satu skrip Bash yang interaktif.</text>

  <!-- Chip -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">
    <rect x="70" y="248" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="145" y="272" text-anchor="middle">Menu Aplikasi</text>
    <rect x="232" y="248" width="110" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="287" y="272" text-anchor="middle">Desktop</text>
    <rect x="354" y="248" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="444" y="272" text-anchor="middle">Perintah Terminal</text>
    <rect x="546" y="248" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="621" y="272" text-anchor="middle">proxychains</text>
  </g>

  <!-- Kartu terminal -->
  <g filter="url(#shadow)">
    <rect x="760" y="62" width="380" height="196" rx="14" fill="#0d1117" stroke="#30363d"/>
  </g>
  <path d="M760 76 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v20 h-380 z" fill="#161b22"/>
  <circle cx="784" cy="80" r="6" fill="#ff5f56"/>
  <circle cx="804" cy="80" r="6" fill="#ffbd2e"/>
  <circle cx="824" cy="80" r="6" fill="#27c93f"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17">
    <text x="782" y="128" fill="#7ee787">$ <tspan fill="#e6edf3">bash appdesk.sh</tspan></text>
    <text x="782" y="158" fill="#8b949e">  1) Add    2) Edit</text>
    <text x="782" y="182" fill="#8b949e">  3) Delete 4) List</text>
    <text x="782" y="216" fill="#7ee787">$ <tspan fill="#e6edf3">proxychains4 opera</tspan></text>
    <rect x="980" y="202" width="10" height="20" fill="#22d3ee" opacity="0.9"/>
  </g>
</svg>
