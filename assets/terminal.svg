<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Tampilan menu AppDesk di terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" rx="18" fill="url(#wall)"/>
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="820" height="520" rx="12" fill="#0d1117" stroke="#30363d"/>
  </g>
  <path d="M40 52 a12 12 0 0 1 12 -12 h796 a12 12 0 0 1 12 12 v30 h-820 z" fill="#161b22"/>
  <circle cx="64" cy="61" r="7" fill="#ff5f56"/>
  <circle cx="86" cy="61" r="7" fill="#ffbd2e"/>
  <circle cx="108" cy="61" r="7" fill="#27c93f"/>
  <text x="450" y="66" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b949e">kali@kali: ~</text>

  <g xml:space="preserve" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18">
    <text x="64" y="118" fill="#7ee787">kali@kali<tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">bash appdesk.sh</tspan></text>

    <text x="64" y="166" fill="#22d3ee">==========================================</text>
    <text x="64" y="192" fill="#e6edf3" font-weight="bold">   APPDESK - Kelola Shortcut Aplikasi</text>
    <text x="64" y="218" fill="#22d3ee">==========================================</text>

    <text x="64" y="250" fill="#e6edf3">  1) Add    <tspan fill="#8b949e">- tambah shortcut</tspan></text>
    <text x="64" y="276" fill="#e6edf3">  2) Edit   <tspan fill="#8b949e">- ubah ikon, nama, argumen, dll</tspan></text>
    <text x="64" y="302" fill="#e6edf3">  3) Delete <tspan fill="#8b949e">- hapus shortcut + bersihkan cache</tspan></text>
    <text x="64" y="328" fill="#e6edf3">  4) List   <tspan fill="#8b949e">- lihat yang sudah ditambahkan</tspan></text>
    <text x="64" y="354" fill="#e6edf3">  5) Keluar</text>
    <text x="64" y="388" fill="#e6edf3">Pilih [1-5]: <tspan fill="#ffbd2e">1</tspan></text>

    <text x="64" y="430" fill="#e6edf3">Nama aplikasi (contoh: Opera): <tspan fill="#ffbd2e">Opera</tspan></text>
    <text x="64" y="456" fill="#e6edf3">Lokasi file executable: <tspan fill="#ffbd2e">~/Downloads/opera/opera</tspan></text>
    <text x="64" y="490" fill="#7ee787">[✓] <tspan fill="#e6edf3">Shortcut dibuat: ~/.local/share/applications/opera.desktop</tspan></text>
    <text x="64" y="516" fill="#7ee787">[✓] <tspan fill="#e6edf3">Perintah terminal: ~/.local/bin/opera</tspan></text>
    <text x="64" y="542" fill="#79c0ff">[i] <tspan fill="#e6edf3">Dengan proxychains : proxychains4 opera</tspan></text>
  </g>
</svg>
